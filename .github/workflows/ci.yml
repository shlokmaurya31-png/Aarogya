name: CI

# CI tests what production runs: PostgreSQL 16 + pgvector (ADR 0001).
#
#   Test & Build      migrate a fresh Postgres, unit tests, production build
#   Integrity gates   npm run verify:all: every scripts/verify-postgres-*.ts
#                     against a reset + migrated + seeded Postgres
#   Migration drift   prisma/migrations must reproduce schema.prisma exactly
#   Lint              ESLint, zero warnings allowed
#
# Every job gets its own disposable pgvector/pgvector:pg16 service container.
# All credentials below are throwaway CI values; no secret is referenced.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aarogya
          POSTGRES_PASSWORD: aarogya
          POSTGRES_DB: aarogya
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://aarogya:aarogya@localhost:5432/aarogya"
      SHADOW_DATABASE_URL: "postgresql://aarogya:aarogya@localhost:5432/aarogya_shadow"
      AUTH_SECRET: "ci-dummy-secret-not-used-for-anything-real-000000"
      CLINICAL_DATA_MODE: synthetic
      AI_PROVIDER: mock
      ABDM_ENVIRONMENT: DISABLED
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create shadow database
        run: PGPASSWORD=aarogya psql -h localhost -U aarogya -d aarogya -c "CREATE DATABASE aarogya_shadow"

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build (prisma generate + next build)
        run: npm run build

  integrity-gates:
    name: Integrity gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aarogya
          POSTGRES_PASSWORD: aarogya
          POSTGRES_DB: aarogya
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://aarogya:aarogya@localhost:5432/aarogya"
      SHADOW_DATABASE_URL: "postgresql://aarogya:aarogya@localhost:5432/aarogya_shadow"
      AUTH_SECRET: "ci-dummy-secret-not-used-for-anything-real-000000"
      CLINICAL_DATA_MODE: synthetic
      AI_PROVIDER: mock
      ABDM_ENVIRONMENT: DISABLED
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create shadow database
        run: PGPASSWORD=aarogya psql -h localhost -U aarogya -d aarogya -c "CREATE DATABASE aarogya_shadow"

      # Resets, migrates and seeds once, then runs every gate in order
      # (scripts/verify-all.ts). Exits non-zero if any gate fails.
      - name: verify:all
        run: npm run verify:all

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: .verify-report/latest.md
          include-hidden-files: true
          if-no-files-found: warn

  migration-drift:
    name: Migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # prisma/migrations (Postgres, the only history) must reproduce
    # schema.prisma exactly. Catches a model added via `prisma db push`
    # without a migration, or a hand-edited migration.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aarogya
          POSTGRES_PASSWORD: aarogya
          POSTGRES_DB: aarogya
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Prisma refuses a shadow database equal to the main one (it wipes the
    # shadow), so the shadow is a separate database.
    env:
      DATABASE_URL: "postgresql://aarogya:aarogya@localhost:5432/aarogya"
      SHADOW_DATABASE_URL: "postgresql://aarogya:aarogya@localhost:5432/aarogya_shadow"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create shadow database
        run: PGPASSWORD=aarogya psql -h localhost -U aarogya -d aarogya -c "CREATE DATABASE aarogya_shadow"

      - name: Migrations match schema
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint -- --max-warnings=0
