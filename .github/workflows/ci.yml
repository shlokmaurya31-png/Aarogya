name: CI

# Automates the integrity discipline Aarogya already enforces by hand every
# phase: the unit suite must stay green and the production build must compile
# and type-check on every change, and lint must pass with zero warnings.
#
# NOT covered here: the ~40 scripts/verify-postgres-*.ts integrity gates. Each
# needs a freshly migrated + seeded Postgres and is non-idempotent, with no
# aggregate runner yet — that belongs in a dedicated workflow with a postgres
# service container, added once an ordered runner exists.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    # Env mirrors .env so prisma generate / next build (which prerenders some
    # routes) never hard-fail on a missing boot variable. All values are
    # local-dev dummies; no secret is referenced.
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      AUTH_SECRET: "ci-dummy-secret-not-used-for-anything-real-000000"
      CLINICAL_DATA_MODE: synthetic
      AI_PROVIDER: mock
      ABDM_ENVIRONMENT: DISABLED
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build (prisma generate + next build)
        run: npm run build

  migration-drift:
    name: Migration drift
    runs-on: ubuntu-latest
    # prisma/migrations (Postgres, the only history) must reproduce
    # schema.prisma exactly. Catches a model added via `prisma db push`
    # without a migration, or a hand-edited migration.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadow"
      SHADOW_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadow"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrations match schema
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint -- --max-warnings=0
